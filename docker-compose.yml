# Stack Frappe CRM + geo_leads, independante du projet FRB.
# Services d'apres frappe_docker (pwd.yml). Domaine a affecter au service "frontend" (port 8080) dans Coolify.
x-image: &image
  image: ${CUSTOM_IMAGE}:${CUSTOM_TAG}
  pull_policy: always
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

services:
  configurator:
    <<: *image
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        ls -1 apps > sites/apps.txt
        bench set-config -g db_host db
        bench set-config -gp db_port 3306
        bench set-config -g redis_cache "redis://redis-cache:6379"
        bench set-config -g redis_queue "redis://redis-queue:6379"
        bench set-config -g redis_socketio "redis://redis-queue:6379"
        bench set-config -gp socketio_port 9000
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  create-site:
    <<: *image
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        wait-for-it -t 120 db:3306
        wait-for-it -t 120 redis-cache:6379
        wait-for-it -t 120 redis-queue:6379
        export start=`date +%s`
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "En attente de sites/common_site_config.json..."
          sleep 5
          if (( `date +%s`-start > 120 )); then echo "Delai depasse" && exit 1; fi
        done
        if [ ! -d "sites/${SITE_NAME}" ]; then
          bench new-site --mariadb-user-host-login-scope='%' \
            --admin-password="${ADMIN_PASSWORD}" \
            --db-root-password="${DB_ROOT_PASSWORD}" \
            --install-app crm --install-app geo_leads \
            --set-default "${SITE_NAME}"
        fi
        # appliqué à chaque déploiement : corriger ALLOW_CORS puis redéployer suffit
        # ALLOW_CORS accepte plusieurs origines séparées par des virgules
        bench --site "${SITE_NAME}" set-config -p allow_cors "`echo "${ALLOW_CORS}" | jq -Rc 'split(",")'`"
    depends_on:
      configurator:
        condition: service_completed_successfully

  backend:
    <<: *image
    depends_on:
      configurator:
        condition: service_completed_successfully

  frontend:
    <<: *image
    command: nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    depends_on:
      - backend
      - websocket

  websocket:
    <<: *image
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    <<: *image
    command: bench worker --queue short,default
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-long:
    <<: *image
    command: bench worker --queue long,default,short
    depends_on:
      configurator:
        condition: service_completed_successfully

  scheduler:
    <<: *image
    command: bench schedule
    depends_on:
      configurator:
        condition: service_completed_successfully

  db:
    image: mariadb:10.6
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--password=${DB_ROOT_PASSWORD}"]
      interval: 5s
      retries: 30
      start_period: 60s
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

volumes:
  sites:
  logs:
  db-data:
  redis-queue-data:
